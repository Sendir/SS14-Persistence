# _Persistence14 content
# Forced-emote status effects applied by the XAEForcedEmote xeno-artifact effect. While active, the
# affected mob repeatedly attempts the emote (see ForcedEmoteStatusEffectSystem). Duration and
# cleanup are handled by the status effect system; parenting MobStatusEffectDebuff means rejuvenate
# and godmode also clear it. To add another, pair a new entry here with an effect entity in
# XenoArch/effects.yml.
- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectForcedLaugh
  name: laughing fit
  components:
  - type: ForcedEmoteStatusEffect
    emote: Laugh

