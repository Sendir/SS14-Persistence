# _Persistence14: the Bastion Ruin's summon roster. Each entry is a stock dangerous mob re-skinned
# into a Bastion guardian - faction overridden to ParagonBastion (one team; hostile to all but the
# eye hivemind) and tagged BastionMob so the Mobs defense can space-rescue it with a tether. Stats,
# sprite and AI stay stock, so these are cheap variants. Tier lives in the summon tables
# (bastion_mob_defense.yml), not here.
#
# NOTE: `factions` is redefined (not merged) so it fully REPLACES the stock faction - a Bastion xeno
# is ParagonBastion only, so it won't treat other xenos as kin nor be ignored by them.

# --- Weak tier ---
- type: entity
  parent: MobGlockroach
  id: MobBastionGlockroach
  suffix: Bastion
  components:
  - type: NpcFactionMember
    factions:
    - ParagonBastion
  - type: BastionMob
