# _Persistence14 content: the fixed structures inside a Bastion Ruin - the Paragon Artifact and its
# analysis pad + console. All three are made indestructible and un-unanchorable at spawn time
# (see BastionRuinSystem: EnableGodmode + strip Anchorable) and run without power (needsPower: false),
# since they are "powered by the artifact". Sprites here are placeholders - assume dedicated art later.
- type: entity
  parent: [ BaseStructureDynamic, BaseXenoArtifact ]
  id: StructureParagonArtifact
  name: paragon artifact
  description: The greatest relic of a vanished people, dense with dormant, unknowable power.
  suffix: Bastion
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Persistence14/Bastion/Artifacts/paragon.rsi
    noRot: true
    layers:
    - state: base
      map: [ "enum.ArtifactsVisualLayers.Base" ]
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano03_on
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.UnlockingEffect" ]
      visible: false
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: artifact-activation
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.ActivationEffect" ]
      visible: false
  - type: Transform
    noRot: true
  # Static + positioned precisely at spawn (NOT tile-anchored, which snaps to a single tile and would
  # break a clean 2x2). Immovability comes from Static; un-unanchoring from stripping Anchorable in code.
  - type: Physics
    bodyType: Static
  # A hard 2x2 box (bounds -1..1 = 2 tiles) so the Paragon physically blocks a 2x2, like a wall.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        density: 190
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  # Effect pools without the self-teleport effect (a fixed structure must never move itself). Each
  # defense variant below may override these to define its own effects/weights.
  - type: XenoArtifact
    suppressed: true
    effectScale: 10 # the Paragon's effects are x10 (see per-effect scaling in the XAE systems)
    artifexiumCostPerTrigger: 20
    artifactGlueCostPerDurability: 50
    rootEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsRoot
    mainEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsMain
    deepEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsDeep
    nodeCount:
      min: 40
      max: 44
    segmentSize:
      min: 8
      max: 13
    nodesPerSegmentLayer:
      min: 1
      max: 4
    scatterPerLayer:
      min: 0
      max: 4
  - type: ItemSlots
    slots:
      paragon_key:
        name: paragon-key-slot
        insertOnInteract: true
        ejectOnInteract: false
        whitelist:
          components:
          - ParagonArtifactKey
  - type: ParagonArtifact
  # Drives the unlock-glow / activation-flash sprite layers (the Paragon has no RandomArtifactSprite, so
  # the stock artifact visualizer never toggles them). Layers are mapped in the Sprite above.
  - type: BastionArtifactVisuals
  # Lets the console's locked screen render this Paragon's key sprite live (set when the key is bound).
  - type: ParagonKeyDisplay
  # How much this artifact's extracted points are worth. Lives on the artifact, not the console.
  - type: ArtifactPointMultiplier
    multiplier: 20
  # Auto-teardown: the ruin removes itself when the Paragon is fully unlocked (after a short console
  # countdown) or when its lifetime runs out. TESTING values; raise before shipping.
  - type: BastionLifecycle
    lifetime: 72000 # 20 hours (seconds)
    completionGrace: 600 # 10 minutes (seconds)
  # Defense-pulse clock. pulseInterval = guaranteed max time between pulses. Bands are matched by
  # seconds-until-next-pulse and drive the console readout; a band with earlyPulseChance can also
  # discharge early while the timer sits in it (per-second chance). Tune all of this here.
  - type: BastionPulse
    # Each cycle rolls a random interval in [min, max]; pulseInterval is the fixed fallback used only if
    # min/max are unset. All values in seconds.
    pulseInterval: 600      # 10 min (fallback)
    pulseIntervalMin: 420   # 7 min
    pulseIntervalMax: 900   # 15 min
    activationRange: 20 # dormant unless a player is within 20 tiles of the Paragon
    # Bands are matched by SECONDS-until-next-pulse (window is 420-900s). Sized for the 7-15 min cadence.
    bands:
    - descriptor: bastion-pulse-distant   # 6 min+ out (quiet)
      from: 360
    - descriptor: bastion-pulse-near      # 2-6 min out (charging)
      from: 120
      to: 360
    - descriptor: bastion-pulse-imminent  # under 2 min; ~0.5%/s chance to discharge early (~45% over the window)
      from: 0
      to: 120
      earlyPulseChance: 0.005

# 2x2 analysis pad the Paragon sits on.
- type: entity
  parent: MachineArtifactAnalyzer
  id: MachineParagonAnalyzerPad
  name: paragon analysis pad
  suffix: Bastion
  components:
  - type: Sprite
    noRot: true
    sprite: _Persistence14/Bastion/Machines/analyzer_pad.rsi
    drawdepth: HighFloorObjects
    scale: 1.5, 1.5
    layers:
    - state: paragon_pad
  - type: ApcPowerReceiver
    needsPower: false
  # Not tile-anchored (positioned precisely at spawn to line up as a clean 2x2 under the Paragon);
  # stays put because it's Static, and Anchorable is stripped in code.
  - type: Transform
    anchored: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        hard: false
        mask:
        - MachineMask

# The console. Placeholder = the stock analysis console sprite.
- type: entity
  parent: ComputerAnalysisConsole
  id: MachineParagonAnalysisConsole
  name: paragon analysis console
  suffix: Bastion
  components:
  - type: ApcPowerReceiver
    needsPower: false
  - type: BastionConsole
  # Its own placeholder sprite folder (copied computer states); swap in dedicated art later.
  - type: Sprite
    sprite: _Persistence14/Bastion/Machines/console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

# --- Paragon variants, one per defense type. Each is the base Paragon with its own placeholder sprite
# and its defense marker component. The BastionRuinSystem spawns the right one for the ruin's defense. ---

- type: entity
  parent: StructureParagonArtifact
  id: StructureParagonArtifactArtifacts
  suffix: Bastion, Artifacts Defense
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Persistence14/Bastion/Artifacts/paragon_artifacts.rsi
    noRot: true
    layers:
    - state: base
      map: [ "enum.ArtifactsVisualLayers.Base" ]
    # Unlock glow / activation flash: the ORIGINAL animated artifact states (this placeholder's matching
    # ano##_on + artifact-activation) scaled 2x over the 64x64 base. BastionArtifactVisualsSystem toggles them.
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano12_on
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.UnlockingEffect" ]
      visible: false
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: artifact-activation
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.ActivationEffect" ]
      visible: false
  - type: BastionDefenseArtifacts
    minCount: 1              # drones per pulse at severity 0
    maxCount: 4              # drones per pulse at severity 1
    minFlingDistance: 3      # fling range, tiles from centre
    maxFlingDistance: 9
    reelDistance: 3        # reel drones back to this distance, then delete
    holdTime: 2              # seconds drones hang out before pulsing
    reelTimeout: 5           # seconds safety cap on the reel
    rootUnlockChance: 0.7    # per drone: chance a root node opens
    depthUnlockBase: 0.15    # deeper-node open chance = base + weight*severity*depth (capped by max)
    depthSeverityWeight: 0.5
    maxUnlockChance: 0.95
    tetherConnectDuration: 0.4    # tether extend/retract animation, seconds
    tetherDisconnectDuration: 0.4

- type: entity
  parent: StructureParagonArtifact
  id: StructureParagonArtifactAnomalies
  suffix: Bastion, Anomalies Defense
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Persistence14/Bastion/Artifacts/paragon_anomalies.rsi
    noRot: true
    layers:
    - state: base
      map: [ "enum.ArtifactsVisualLayers.Base" ]
    # Unlock glow / activation flash: the ORIGINAL animated artifact states (this placeholder's matching
    # ano##_on + artifact-activation) scaled 2x over the 64x64 base. BastionArtifactVisualsSystem toggles them.
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano22_on
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.UnlockingEffect" ]
      visible: false
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: artifact-activation
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.ActivationEffect" ]
      visible: false
  - type: BastionDefenseAnomalies
    minCount: 1              # anomalies per pulse at severity 0
    maxCount: 5              # anomalies per pulse at severity 1
    maxAlive: 20             # cap on simultaneously-live anomalies
    minDistance: 3           # placement ring, tiles from centre
    maxDistance: 9
    leashRange: 9            # gauntlet-punch distance that force-crits
    minRampPerSecond: 0.02   # severity ramp toward crit (lerped by Paragon severity)
    maxRampPerSecond: 0.1
    growDuration: 0.8        # materialize animation, seconds
    startScale: 0.2
    trapHoldTime: 1.5        # seconds a tether lingers on an injector trap
    tetherConnectDuration: 2
    tetherDisconnectDuration: 2

- type: entity
  parent: StructureParagonArtifact
  id: StructureParagonArtifactMobs
  suffix: Bastion, Mobs Defense
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Persistence14/Bastion/Artifacts/paragon_mobs.rsi
    noRot: true
    layers:
    - state: base
      map: [ "enum.ArtifactsVisualLayers.Base" ]
    # Unlock glow / activation flash: the ORIGINAL animated artifact states (this placeholder's matching
    # ano##_on + artifact-activation) scaled 2x over the 64x64 base. BastionArtifactVisualsSystem toggles them.
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano33_on
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.UnlockingEffect" ]
      visible: false
    - sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: artifact-activation
      scale: 2, 2
      map: [ "enum.ArtifactsVisualLayers.ActivationEffect" ]
      visible: false
  # Every node spawns guardians: override the shared effect pools with the mob-only, depth-tiered tables.
  # effectScale 1 (not the base's 10): each mob node spawns its own native min..max pack, so the generic
  # x-scaling must NOT also multiply it - the count lives entirely in the effect's RangeNumberSelector.
  - type: XenoArtifact
    effectScale: 1
    rootEffectsTable: !type:NestedSelector
      tableId: BastionParagonMobEffectsRoot
    mainEffectsTable: !type:NestedSelector
      tableId: BastionParagonMobEffectsMain
    deepEffectsTable: !type:NestedSelector
      tableId: BastionParagonMobEffectsDeep
  - type: BastionDefenseMobs
    minCount: 2              # mobs per wave at severity 0
    maxCount: 10             # mobs per wave at severity 1
    maxAlive: 50             # live-wave cap
    mediumSeverity: 0.34     # severity to switch to the medium pool
    deadlySeverity: 0.67     # severity to switch to the deadly pool
    spawnRadius: 6           # wave scatter around the Paragon
    leashRadius: 9           # reel home past this. = the platform's max reach (RuinHalfSize 9)
    fetchScanRadius: 30      # how far out strays are scanned for (must be >= leashRadius to catch them)
    reelDistance: 3        # release distance when reeled home
    fetchScanInterval: 1     # seconds between stray scans
    # pools default to BastionMobPool{Weak,Medium,Deadly} (defined in bastion_mob_defense.yml)

# --- Defense A payload: the artifacts the Artifacts-defense Paragon flings out. A structure artifact
# (parent ComplexXenoArtifact => non-handheld effect tables, so it can NEVER roll the resync effect and
# spawn a nested ruin). Dynamic body so the tether can fling it out and reel it in. x3 effect scale, a
# smaller graph than a normal artifact, and pointed at the Bastion effect pools (no self-movers). ---
- type: entity
  parent: ComplexXenoArtifact
  id: StructureBastionDefenseArtifact
  name: paragon defense artifact
  description: A shard of the Paragon's power, spat out to drive off intruders.
  suffix: Bastion Defense
  # NOTE: stays a KinematicController mob here (inherited) so it's a valid artifact/mob at rest. The
  # defense system converts it to a Dynamic prop at spawn (strips the mob-mover comps + sets Dynamic) so
  # the tether's MouseJoint can physically fling and reel it - see BastionDefenseArtifactsSystem.
  components:
  - type: XenoArtifact
    # Suppressed: the Bastion system fully drives these (unlocks nodes + pulses them directly). Suppression
    # stops the XAT trigger/unlock machinery from running on them - ambient gas/heat/pressure
    suppressed: true
    effectScale: 3 # defense artifacts fire at x3 (see per-effect scaling in the XAE systems)
    rootEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsRoot
    mainEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsMain
    deepEffectsTable: !type:NestedSelector
      tableId: BastionParagonEffectsDeep
