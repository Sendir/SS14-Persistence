# _Persistence14: the Mobs-defense Paragon's content, generated from the roster in bastion_mobs.yml.
# Three parts:
#  1. Per-mob spawn EFFECTS - each names ONE guardian and spawns min..max of it (native RangeNumberSelector,
#     so a node yields a small pack, minimum one, with NO reliance on EffectScale). The Mobs Paragon sets
#     effectScale: 1 so the generic x-scaling doesn't multiply these.
#  2. Node-effect TABLES (root/main/deep) - which mob-effects a node of each depth can roll, tiered by
#     deadliness. This is how 'every node is a spawn node, deeper = deadlier' is expressed.
#  3. Wave POOLS (weak/medium/deadly) - the defense wave picks ONE mob per roll from the tier its severity
#     selects (see BastionDefenseMobsSystem).

# =====================================================================================
# 1. Per-mob spawn effects
# =====================================================================================
- type: entity
  parent: BaseXenoArtifactEffect
  id: XenoArtifactEffectBastionGlockroach
  description: Tears armed glockroaches into being.
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      spawnDetached: true
      offset: 1.5
      table: !type:EntSelector
        id: MobBastionGlockroach
        amount: !type:RangeNumberSelector
          range: 2, 6
